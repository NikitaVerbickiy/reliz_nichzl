<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Власні CSS-стилі -->

    <link rel="stylesheet" href="style.css" />
    <title>Кошик</title>
  </head>
  <body>
    <header>
      <div class="up_panel_cash">ВАШІ КВИТКИ ТА ПОСЛУГИ</div>
    </header>

    <main class="container my-4b cart-main">
      <section class="cart py-4">
        <h2>Ваш кошик</h2>
        <div class="cart-items-list">У кошику ще немає товарів</div>
        <div class="margin-y">
          Сума замовлення: <span class="cart-total">0</span> грн.
        </div>
        <button id="orderBtn" class="cart-btn margin-y">
          Оформити замовлення
        </button>
        <button id="deleteBtn" class="cart-btn margin-y">
          Очистити корзину
        </button>
      </section>
      <section class="order">
        <h2>Оформлення послуги</h2>
        <form class="order-form" action="" method="post">
          <div class="form-group mt-3">
            <label for="firstName">Ім'я:</label>
            <input
              class="form-control"
              type="text"
              id="firstName"
              name="firstName"
              required
            />
          </div>

          <div class="form-group mt-3">
            <label for="lastName">Прізвище:</label>
            <input
              class="form-control"
              type="text"
              id="lastName"
              name="lastName"
              required
            />
          </div>

          <div class="form-group mt-3">
            <label for="email">Електронна пошта:</label>
            <input
              class="form-control"
              type="email"
              id="email"
              name="email"
              required
            />
          </div>

          <div class="form-group mt-3">
            <label for="phone">Номер телефону:</label>
            <input
              class="form-control"
              type="tel"
              id="phone"
              name="phone"
              required
            />
          </div>

          <div class="form-group mt-3">
            <label for="comment">Коментар:</label>
            <textarea
              class="form-control"
              id="comment"
              name="comment"
              rows="4"
            ></textarea>
          </div>
          <button type="button" class="confirm-order-btn margin-y">
            Забронювати послугу
          </button>
        </form>
      </section>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <script src="main.js"></script>
  </body>
</html>
